[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hp-ml"
version = "0.1.0"
description = "Automated CSI broad-based ETF discovery, data mining, feature engineering and model training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "akshare>=1.18.64",
  "kaggle>=1.7.4.5",
  "pytest>=9.0.3",
]

[project.scripts]
hp-ml-train = "hp_ml.train:main"
hp-ml-discover = "hp_ml.discover:main"
hp-ml-auto-tune = "hp_ml.auto_tune_baseline:main"
hp-ml-export-tdx = "hp_ml.export_tdx:main"

[tool.setuptools]
packages = ["hp_ml"]
