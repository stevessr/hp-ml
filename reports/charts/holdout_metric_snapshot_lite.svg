<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="404" viewBox="0 0 1120 404" role="img">
<style>
  text { font-family: 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC','WenQuanYi Micro Hei',Arial,sans-serif; fill: #0f172a; }
  .title { font-size: 24px; font-weight: 800; }
  .subtitle { font-size: 13px; fill: #64748b; }
  .label { font-size: 12px; fill: #0f172a; }
  .muted { font-size: 11px; fill: #64748b; }
  .axis { stroke: #e2e8f0; stroke-width: 1; }
</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
